
services:
  db:
    image: postgres:16
    container_name: dropzone-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dropzone
      POSTGRES_USER: dropzone
      POSTGRES_PASSWORD: dropzone_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropzone -d dropzone"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dropzone-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://dropzone:dropzone_password@db:5432/dropzone
      LOG_LEVEL: INFO
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: dropzone-front
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
