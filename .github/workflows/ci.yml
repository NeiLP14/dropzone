
name: DropZone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # 1. Lint : qualité du code
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Ruff check
        run: ruff check .
        working-directory: backend

      - name: Ruff format
        run: ruff format --check .
        working-directory: backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript
        run: npm run typecheck
        working-directory: frontend


  # 2. Tests backend
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Pytest with coverage
        run: pytest --cov=app --cov-report=xml --cov-fail-under=85
        working-directory: backend


  # 3. Tests frontend
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Vitest
        run: npm test
        working-directory: frontend

      - name: Production build
        run: npm run build
        working-directory: frontend


  # 4. Tests E2E : uniquement si les trois jobs précédents réussissent
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [lint, backend-tests, frontend-tests]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.backend-tests.result == 'success' && needs.frontend-tests.result == 'success' }}

    timeout-minutes: 20

    env:
      POSTGRES_DB: dropzone
      POSTGRES_USER: dropzone
      POSTGRES_PASSWORD: dropzone_password
      DATABASE_URL: postgresql+psycopg://dropzone:dropzone_password@db:5432/dropzone
      LOG_LEVEL: INFO
      SEED_DEMO_DATA: "true"
      CORS_ORIGINS: ""
      VITE_API_URL: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Check API availability
        run: curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://localhost:8000/health

      - name: Check frontend availability
        run: curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://localhost:8080

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v
